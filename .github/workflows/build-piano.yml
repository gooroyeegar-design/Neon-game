name: Build stable Piano APK
on:
  push:
    paths:
      - 'piano/**'
      - '.github/workflows/build-piano.yml'
  pull_request:
    paths:
      - 'piano/**'
      - '.github/workflows/build-piano.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stable-piano-apk
          path: piano/app/build/outputs/apk/debug/app-debug.apk
